<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Round 3 — Narrower P + Triangle Pin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #fff; padding: 30px; }
  h1 { text-align: center; margin-bottom: 8px; font-weight: 300; font-size: 24px; }
  p.sub { text-align: center; color: #888; margin-bottom: 40px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; max-width: 1100px; margin: 0 auto 60px; }
  .card { text-align: center; }
  .card h3 { font-size: 13px; margin-bottom: 12px; color: #aaa; font-weight: 400; }
  .preview { display: flex; gap: 16px; justify-content: center; align-items: flex-end; }
  .preview .dark, .preview .light { border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .preview .dark { background: #1a1a2e; }
  .preview .light { background: #fff; }
  .preview img { width: 80px; height: 80px; }
  .smalls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  .smalls img { width: 32px; height: 32px; }
  .smalls .sm-dark { background: #1a1a2e; border-radius: 6px; padding: 4px; }
  .smalls .sm-light { background: #fff; border-radius: 6px; padding: 4px; }
  hr { border: none; border-top: 1px solid #333; margin: 20px auto; max-width: 1100px; }
</style>
</head>
<body>
<h1>Narrower P Bowl + Triangle Pin (based on 2C)</h1>
<p class="sub">Bowl is tighter and more recognisably a letter P &bull; triangle pin stays sharp</p>

<div class="grid">
  <div class="card">
    <h3>3A — Classic Narrow</h3>
    <div class="preview">
      <div class="dark"><img src="icon-3a-narrow.svg"/></div>
      <div class="light"><img src="icon-3a-narrow.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-3a-narrow.svg"/></div>
      <div class="sm-light"><img src="icon-3a-narrow.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>3B — True Letterform</h3>
    <div class="preview">
      <div class="dark"><img src="icon-3b-true.svg"/></div>
      <div class="light"><img src="icon-3b-true.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-3b-true.svg"/></div>
      <div class="sm-light"><img src="icon-3b-true.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>3C — Tight Bowl</h3>
    <div class="preview">
      <div class="dark"><img src="icon-3c-tight.svg"/></div>
      <div class="light"><img src="icon-3c-tight.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-3c-tight.svg"/></div>
      <div class="sm-light"><img src="icon-3c-tight.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>3D — Compact</h3>
    <div class="preview">
      <div class="dark"><img src="icon-3d-compact.svg"/></div>
      <div class="light"><img src="icon-3d-compact.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-3d-compact.svg"/></div>
      <div class="sm-light"><img src="icon-3d-compact.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>3E — Soft Rounded</h3>
    <div class="preview">
      <div class="dark"><img src="icon-3e-softrounded.svg"/></div>
      <div class="light"><img src="icon-3e-softrounded.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-3e-softrounded.svg"/></div>
      <div class="sm-light"><img src="icon-3e-softrounded.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>3F — Bold Stem</h3>
    <div class="preview">
      <div class="dark"><img src="icon-3f-boldstem.svg"/></div>
      <div class="light"><img src="icon-3f-boldstem.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-3f-boldstem.svg"/></div>
      <div class="sm-light"><img src="icon-3f-boldstem.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>3G — Elegant Thin</h3>
    <div class="preview">
      <div class="dark"><img src="icon-3g-elegant.svg"/></div>
      <div class="light"><img src="icon-3g-elegant.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-3g-elegant.svg"/></div>
      <div class="sm-light"><img src="icon-3g-elegant.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>3H — Balanced + Rounded Tip</h3>
    <div class="preview">
      <div class="dark"><img src="icon-3h-balanced.svg"/></div>
      <div class="light"><img src="icon-3h-balanced.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-3h-balanced.svg"/></div>
      <div class="sm-light"><img src="icon-3h-balanced.svg"/></div>
    </div>
  </div>
</div>
</body>
</html>
