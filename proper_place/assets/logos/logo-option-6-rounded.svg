<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <!-- Option 6: Rounded badge style - app icon friendly -->
  <defs>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7BA7D8"/>
      <stop offset="100%" style="stop-color:#5B8FC4"/>
    </linearGradient>
  </defs>
  <!-- "PP" monogram badge -->
  <rect x="10" y="15" width="85" height="85" rx="20" fill="url(#badge)"/>
  <text x="52" y="72" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-2" fill="white">PP</text>
  <!-- Full name next to badge -->
  <text x="115" y="52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="1" fill="#1E293B">Proper</text>
  <text x="115" y="88" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="300" letter-spacing="1" fill="#7BA7D8">Place</text>
</svg>
