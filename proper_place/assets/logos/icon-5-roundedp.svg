<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- ICON 5: The Rounded P — Super bold, rounded, modern P like Booking's B -->
  <!-- Thick rounded strokes, friendly, unmistakable -->
  <rect x="20" y="10" width="160" height="180" rx="40" fill="#7BA7D8"/>
  <!-- Cut out to form the P shape -->
  <!-- Bottom right cut -->
  <rect x="90" y="105" width="100" height="85" rx="0" fill="white"/>
  <!-- Inner P counter (the hole) -->
  <rect x="90" y="30" width="70" height="60" rx="30" fill="white"/>
  <!-- Re-fill the P's inner wall -->
  <rect x="90" y="38" width="32" height="44" rx="0" fill="#7BA7D8"/>
  <!-- Clean up bottom left -->
  <rect x="20" y="105" width="50" height="85" rx="0" fill="#7BA7D8"/>
  <rect x="20" y="150" width="50" height="40" rx="40" fill="#7BA7D8"/>
</svg>
