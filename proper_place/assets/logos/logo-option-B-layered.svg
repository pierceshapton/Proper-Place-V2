<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150">
  <!-- Option B: Overlapping letters with opacity play -->
  <defs>
    <linearGradient id="overGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7BA7D8"/>
      <stop offset="100%" style="stop-color:#4A7EB3"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7BA7D8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Large background "PP" watermark -->
  <text x="240" y="125" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="160" font-weight="900" letter-spacing="-10" fill="#7BA7D8" opacity="0.07">PP</text>
  <!-- Main text -->
  <text x="240" y="72" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="200" letter-spacing="12" fill="#7BA7D8" filter="url(#softShadow)">proper</text>
  <text x="240" y="118" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="12" fill="#1E293B">place</text>
  <!-- Thin divider line with gradient fade -->
  <line x1="100" y1="84" x2="380" y2="84" stroke="#7BA7D8" stroke-width="0.5" opacity="0.6"/>
</svg>
