<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <!-- Option A: Hand-drawn style with flowing script connection -->
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5B8FC4"/>
      <stop offset="50%" style="stop-color:#7BA7D8"/>
      <stop offset="100%" style="stop-color:#9BBDE4"/>
    </linearGradient>
  </defs>
  <!-- Flowing underline swoosh -->
  <path d="M30 105 Q120 95 200 100 T400 90 Q430 88 460 95" stroke="url(#flowGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M25 108 Q120 98 200 103 T400 93 Q430 91 465 98" stroke="#7BA7D8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.3"/>
  <!-- "proper" in light flowing weight -->
  <text x="30" y="85" font-family="'Georgia', 'Palatino', serif" font-size="58" font-weight="400" font-style="italic" letter-spacing="1" fill="#7BA7D8">proper</text>
  <!-- "place" in contrasting bold sans -->
  <text x="290" y="85" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-1" fill="#1E293B">place</text>
  <!-- Decorative scatter dots like a constellation -->
  <circle cx="35" cy="25" r="2" fill="#7BA7D8" opacity="0.3"/>
  <circle cx="55" cy="18" r="1.5" fill="#7BA7D8" opacity="0.5"/>
  <circle cx="48" cy="35" r="1" fill="#7BA7D8" opacity="0.4"/>
  <circle cx="70" cy="22" r="2.5" fill="#7BA7D8" opacity="0.2"/>
  <circle cx="460" cy="30" r="2" fill="#7BA7D8" opacity="0.3"/>
  <circle cx="445" cy="20" r="1.5" fill="#7BA7D8" opacity="0.5"/>
  <circle cx="470" cy="40" r="1" fill="#7BA7D8" opacity="0.4"/>
</svg>
