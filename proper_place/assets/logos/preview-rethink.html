<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Round 4 — Rethought P + Pin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #fff; padding: 30px; }
  h1 { text-align: center; margin-bottom: 8px; font-weight: 300; font-size: 24px; }
  p.sub { text-align: center; color: #888; margin-bottom: 40px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; max-width: 1100px; margin: 0 auto 60px; }
  .card { text-align: center; }
  .card h3 { font-size: 13px; margin-bottom: 12px; color: #aaa; font-weight: 400; }
  .preview { display: flex; gap: 16px; justify-content: center; align-items: flex-end; }
  .preview .dark, .preview .light { border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .preview .dark { background: #1a1a2e; }
  .preview .light { background: #fff; }
  .preview img { width: 80px; height: 80px; }
  .smalls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  .smalls img { width: 32px; height: 32px; }
  .smalls .sm-dark { background: #1a1a2e; border-radius: 6px; padding: 4px; }
  .smalls .sm-light { background: #fff; border-radius: 6px; padding: 4px; }
</style>
</head>
<body>
<h1>Rethought P — Different Bowl Styles + Triangle Pin</h1>
<p class="sub">Each one takes a different design approach to the letter P</p>

<div class="grid">
  <div class="card">
    <h3>4A — Typographic</h3>
    <div class="preview">
      <div class="dark"><img src="icon-4a-typo.svg"/></div>
      <div class="light"><img src="icon-4a-typo.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-4a-typo.svg"/></div>
      <div class="sm-light"><img src="icon-4a-typo.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>4B — Round Modern</h3>
    <div class="preview">
      <div class="dark"><img src="icon-4b-roundmodern.svg"/></div>
      <div class="light"><img src="icon-4b-roundmodern.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-4b-roundmodern.svg"/></div>
      <div class="sm-light"><img src="icon-4b-roundmodern.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>4C — Geometric Semi</h3>
    <div class="preview">
      <div class="dark"><img src="icon-4c-geometric.svg"/></div>
      <div class="light"><img src="icon-4c-geometric.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-4c-geometric.svg"/></div>
      <div class="sm-light"><img src="icon-4c-geometric.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>4D — Heavyweight</h3>
    <div class="preview">
      <div class="dark"><img src="icon-4d-heavy.svg"/></div>
      <div class="light"><img src="icon-4d-heavy.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-4d-heavy.svg"/></div>
      <div class="sm-light"><img src="icon-4d-heavy.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>4E — Pinterest-esque</h3>
    <div class="preview">
      <div class="dark"><img src="icon-4e-pinterest.svg"/></div>
      <div class="light"><img src="icon-4e-pinterest.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-4e-pinterest.svg"/></div>
      <div class="sm-light"><img src="icon-4e-pinterest.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>4F — Open Bowl</h3>
    <div class="preview">
      <div class="dark"><img src="icon-4f-open.svg"/></div>
      <div class="light"><img src="icon-4f-open.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-4f-open.svg"/></div>
      <div class="sm-light"><img src="icon-4f-open.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>4G — Sleek D-Counter</h3>
    <div class="preview">
      <div class="dark"><img src="icon-4g-sleek.svg"/></div>
      <div class="light"><img src="icon-4g-sleek.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-4g-sleek.svg"/></div>
      <div class="sm-light"><img src="icon-4g-sleek.svg"/></div>
    </div>
  </div>
  <div class="card">
    <h3>4H — Futura Circle</h3>
    <div class="preview">
      <div class="dark"><img src="icon-4h-futura.svg"/></div>
      <div class="light"><img src="icon-4h-futura.svg"/></div>
    </div>
    <div class="smalls">
      <div class="sm-dark"><img src="icon-4h-futura.svg"/></div>
      <div class="sm-light"><img src="icon-4h-futura.svg"/></div>
    </div>
  </div>
</div>
</body>
</html>
