<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- ICON 7: The Abstract PP — Two overlapping P shapes creating a unique mark -->
  <!-- First P (lighter, behind) -->
  <path d="
    M30 175
    L30 30
    L85 30
    Q125 30 125 70
    Q125 110 85 110
    L62 110
    L62 175
    Z
  " fill="#5B8FC4" opacity="0.6"/>
  <!-- Second P (darker, overlapping, offset right) -->
  <path d="
    M70 175
    L70 30
    L125 30
    Q165 30 165 70
    Q165 110 125 110
    L102 110
    L102 175
    Z
  " fill="#7BA7D8"/>
  <!-- Counter of second P -->
  <ellipse cx="128" cy="70" rx="16" ry="20" fill="white"/>
</svg>
