<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <!-- Option D: Artistic circle badge with landscape silhouette -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9BBDE4"/>
      <stop offset="40%" style="stop-color:#7BA7D8"/>
      <stop offset="100%" style="stop-color:#5B8FC4"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="200" cy="75" r="65"/>
    </clipPath>
  </defs>
  <!-- Main circle -->
  <circle cx="200" cy="75" r="65" fill="url(#skyGrad)"/>
  <!-- Rolling hills silhouette inside circle -->
  <g clip-path="url(#circleClip)">
    <path d="M135 100 Q155 75 180 90 Q200 100 220 85 Q240 70 260 88 Q270 95 280 90 L280 140 L135 140Z" fill="#1E293B" opacity="0.6"/>
    <path d="M135 110 Q160 90 185 100 Q210 110 235 95 Q255 85 280 100 L280 140 L135 140Z" fill="#1E293B" opacity="0.8"/>
    <!-- Tiny campervan silhouette on the hill -->
    <g transform="translate(195, 88) scale(0.4)">
      <rect x="0" y="5" width="30" height="15" rx="2" fill="white" opacity="0.9"/>
      <rect x="22" y="0" width="12" height="20" rx="2" fill="white" opacity="0.9"/>
      <circle cx="8" cy="22" r="4" fill="#1E293B"/>
      <circle cx="26" cy="22" r="4" fill="#1E293B"/>
    </g>
    <!-- Moon -->
    <circle cx="230" cy="50" r="6" fill="white" opacity="0.85"/>
    <!-- Stars -->
    <circle cx="165" cy="45" r="1" fill="white" opacity="0.7"/>
    <circle cx="175" cy="55" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="250" cy="42" r="1.2" fill="white" opacity="0.6"/>
    <circle cx="155" cy="60" r="0.6" fill="white" opacity="0.4"/>
    <circle cx="245" cy="58" r="0.8" fill="white" opacity="0.5"/>
  </g>
  <!-- Circle border ring -->
  <circle cx="200" cy="75" r="65" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  <!-- Text below -->
  <text x="200" y="165" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="300" letter-spacing="10" fill="#7BA7D8">PROPER</text>
  <text x="200" y="165" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="10" fill="#1E293B" dx="0" dy="0" opacity="0">PLACE</text>
  <!-- Stacked text -->
  <text x="200" y="176" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="14" fill="#1E293B">PLACE</text>
</svg>
