<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 5H: Overlapping — small P overlaps big P from the right, two-tone -->
  <!-- Big P -->
  <rect x="30" y="5" width="22" height="103" fill="#7BA7D8"/>
  <circle cx="74" cy="42" r="37" fill="#7BA7D8"/>
  <circle cx="74" cy="42" r="20" fill="white"/>
  <!-- Small P overlapping, slightly darker -->
  <rect x="100" y="22" width="16" height="76" fill="#5B8FC4"/>
  <circle cx="131" cy="48" r="26" fill="#5B8FC4"/>
  <circle cx="131" cy="48" r="14" fill="white"/>
  <!-- Small P's triangle pin -->
  <path d="M100 110 L116 110 L108 160 Z" fill="#5B8FC4"/>
  <!-- Big P's triangle pin -->
  <path d="M30 120 L52 120 L41 186 Z" fill="#7BA7D8"/>
</svg>
