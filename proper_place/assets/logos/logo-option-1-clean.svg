<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Option 1: Clean modern wordmark with pin dot on the 'i' replaced by dot on P -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5B8FC4"/>
      <stop offset="100%" style="stop-color:#7BA7D8"/>
    </linearGradient>
  </defs>
  <text x="200" y="72" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="300" letter-spacing="3" fill="url(#grad1)">proper</text>
  <text x="200" y="72" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="3" fill="#2C3E50" dx="166">place</text>
  <!-- Subtle underline accent -->
  <line x1="30" y1="88" x2="370" y2="88" stroke="#7BA7D8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Location pin dot -->
  <circle cx="370" cy="88" r="4" fill="#7BA7D8"/>
</svg>
