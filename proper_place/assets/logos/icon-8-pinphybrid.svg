<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- ICON 8: The Pin-P Hybrid — Shape is both a pin AND a P simultaneously -->
  <!-- The overall silhouette is a location pin, but inside it reads as P -->
  <path d="
    M100 190
    C100 190 25 120 25 75
    C25 33.6 58.6 0 100 0
    C141.4 0 175 33.6 175 75
    C175 120 100 190 100 190Z
  " fill="#7BA7D8"/>
  <!-- White shape that creates both the P counter AND the pin's inner circle -->
  <circle cx="115" cy="65" r="28" fill="white"/>
  <!-- Blue rectangle completing the P stem illusion -->
  <rect x="60" y="30" width="33" height="120" rx="0" fill="white"/>
  <rect x="68" y="38" width="18" height="100" rx="0" fill="#7BA7D8"/>
  <!-- reconnect top of P to bowl -->
  <rect x="68" y="38" width="50" height="18" rx="0" fill="#7BA7D8"/>
</svg>
