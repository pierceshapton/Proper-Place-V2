<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130">
  <!-- Option C: Custom letterforms with artistic pin replacing the 'l' in place -->
  <defs>
    <linearGradient id="pinC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9BBDE4"/>
      <stop offset="100%" style="stop-color:#5B8FC4"/>
    </linearGradient>
  </defs>
  <!-- "Proper" with custom spacing -->
  <text x="0" y="80" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="62" font-weight="100" letter-spacing="4" fill="#7BA7D8">Proper</text>
  <!-- "P" of Place -->
  <text x="275" y="80" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="0" fill="#1E293B">P</text>
  <!-- Location pin replacing 'l' -->
  <g transform="translate(318, 30)">
    <path d="M10 0C4.48 0 0 4.48 0 10c0 7.5 10 18 10 18s10-10.5 10-18C20 4.48 15.52 0 10 0z" fill="url(#pinC)"/>
    <circle cx="10" cy="9" r="4" fill="white"/>
  </g>
  <!-- "ace" completing "Place" -->
  <text x="340" y="80" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="0" fill="#1E293B">ace</text>
  <!-- Artistic brush stroke underline -->
  <path d="M5 100 Q60 92 150 96 T300 93 Q400 90 500 97" stroke="#7BA7D8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.35"/>
  <path d="M8 104 Q80 100 150 101 T320 98 Q420 95 510 100" stroke="#7BA7D8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.15"/>
</svg>
