<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <!-- Option 2: Stacked layout - "proper" light, "place" bold -->
  <text x="160" y="65" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="300" letter-spacing="8" fill="#7BA7D8">proper</text>
  <text x="160" y="120" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="8" fill="#2C3E50">place</text>
  <!-- Small location pin between words -->
  <path d="M160 75 L160 82" stroke="#7BA7D8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="160" cy="74" r="3" fill="#7BA7D8"/>
</svg>
