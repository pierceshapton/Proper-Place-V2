<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" width="480" height="110">
  <!-- Option 4: Text with integrated location pin icon -->
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7BA7D8"/>
      <stop offset="100%" style="stop-color:#5B8FC4"/>
    </linearGradient>
  </defs>
  <!-- Location pin mark -->
  <g transform="translate(10, 12)">
    <path d="M20 0C8.95 0 0 8.95 0 20c0 15 20 32 20 32s20-17 20-32C40 8.95 31.05 0 20 0z" fill="url(#pinGrad)"/>
    <circle cx="20" cy="18" r="8" fill="white"/>
    <text x="20" y="24" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#7BA7D8">P</text>
  </g>
  <!-- "roper" to complete "Proper" -->
  <text x="56" y="62" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="300" letter-spacing="1" fill="#7BA7D8">roper</text>
  <!-- "Place" bold dark -->
  <text x="260" y="62" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="1" fill="#1E293B">Place</text>
  <!-- Subtle tagline -->
  <text x="260" y="88" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="4" fill="#94A3B8" text-transform="uppercase">PARK YOUR WAY</text>
</svg>
