<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <!-- Option E: Split colour overlap with artistic offset -->
  <defs>
    <linearGradient id="blueE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9BBDE4"/>
      <stop offset="100%" style="stop-color:#5B8FC4"/>
    </linearGradient>
  </defs>
  <!-- Shadow text offset for depth -->
  <text x="22" y="90" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-2" fill="#7BA7D8" opacity="0.12">Proper Place</text>
  <!-- "Proper" with artistic thin strokes -->
  <text x="18" y="85" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="100" letter-spacing="-1" fill="url(#blueE)">Proper</text>
  <!-- "Place" bold and dark, slightly overlapping -->
  <text x="270" y="85" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-2" fill="#1E293B">Place</text>
  <!-- Artistic geometric accents -->
  <circle cx="18" cy="110" r="8" fill="#7BA7D8" opacity="0.15"/>
  <circle cx="18" cy="110" r="4" fill="#7BA7D8" opacity="0.3"/>
  <rect x="460" y="98" width="20" height="3" rx="1.5" fill="#7BA7D8" opacity="0.4"/>
  <rect x="440" y="104" width="40" height="2" rx="1" fill="#7BA7D8" opacity="0.2"/>
  <rect x="450" y="110" width="30" height="1.5" rx="0.75" fill="#7BA7D8" opacity="0.1"/>
</svg>
