<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgLight" x1="0" x2="1">
      <stop offset="0" stop-color="#4a90e2"/>
      <stop offset="1" stop-color="#357abd"/>
    </linearGradient>

    <linearGradient id="logoGradL" x1="0" x2="1">
      <stop offset="0" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#4a90e2"/>
    </linearGradient>

    <filter id="phoneShadowL" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="0" fill="url(#bgLight)"/>

  <!-- Left content -->
  <g transform="translate(72,72)">
    <!-- Logo circle -->
    <g transform="translate(0,0)">
      <circle cx="56" cy="56" r="56" fill="#ffffff" opacity="0.18"/>
      <circle cx="56" cy="56" r="46" fill="url(#logoGradL)"/>
      <text x="56" y="70" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="36" text-anchor="middle" fill="#fff">PP</text>
    </g>

    <!-- Title -->
    <text x="140" y="56" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="44" fill="#333333">Proper Place</text>
    <text x="140" y="96" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="20" fill="#333333" opacity="0.95">Find &amp; book unique short stays</text>

    <!-- CTA row -->
    <g transform="translate(0,130)">
      <rect x="0" y="0" rx="18" width="360" height="48" fill="#ffffff" opacity="0.14"/>
      <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="18" fill="#333333">Search  •  Book  •  Host</text>
    </g>

    <!-- Headline -->
    <text x="0" y="220" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="36" fill="#333333">Book great places in minutes</text>
  </g>

  <!-- Right: phone mockup -->
  <g transform="translate(680,40)">
    <rect x="-40" y="0" width="320" height="420" rx="28" fill="#ffffff" filter="url(#phoneShadowL)"/>
    <!-- phone header -->
    <rect x="-20" y="12" rx="10" width="280" height="56" fill="#f2f6fb"/>
    <!-- listing cards -->
    <g transform="translate(-20,84)">
      <!-- card 1 -->
      <rect x="0" y="0" rx="12" width="280" height="76" fill="#fff" opacity="1"/>
      <rect x="10" y="10" width="56" height="56" rx="8" fill="#f5f8ff"/>
      <rect x="76" y="12" width="140" height="18" rx="4" fill="#eef8ff"/>
      <rect x="76" y="36" width="90" height="14" rx="4" fill="#eef8ff" opacity="0.8"/>
      <text x="240" y="28" font-family="Inter, Arial, sans-serif" font-size="14" fill="#333333" font-weight="700">£45</text>

      <!-- card 2 -->
      <rect x="0" y="92" rx="12" width="280" height="76" fill="#fff"/>
      <rect x="10" y="102" width="56" height="56" rx="8" fill="#fff7ec"/>
      <rect x="76" y="104" width="140" height="18" rx="4" fill="#fff7f0"/>
      <rect x="76" y="128" width="90" height="14" rx="4" fill="#fff7f0" opacity="0.8"/>
      <text x="240" y="116" font-family="Inter, Arial, sans-serif" font-size="14" fill="#333333" font-weight="700">£62</text>

      <!-- card 3 -->
      <rect x="0" y="184" rx="12" width="280" height="76" fill="#fff"/>
      <rect x="10" y="194" width="56" height="56" rx="8" fill="#f6f0ff"/>
      <rect x="76" y="196" width="140" height="18" rx="4" fill="#f3f0ff"/>
      <rect x="76" y="220" width="90" height="14" rx="4" fill="#f3f0ff" opacity="0.8"/>
      <text x="240" y="206" font-family="Inter, Arial, sans-serif" font-size="14" fill="#333333" font-weight="700">£80</text>
    </g>
  </g>

  <!-- small footer note -->
  <text x="72" y="480" font-family="Inter, Arial, sans-serif" font-size="12" fill="#333333" opacity="0.75">Search • Book • Host — Proper Place</text>

</svg>
